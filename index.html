<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChampAnalyze Pro</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f293d;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px 15px; max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        .logo-title { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge-pro { background: #ef4444; color: white; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: bold; -webkit-text-fill-color: white; }
        .subtitle { color: var(--text-sub); font-size: 13px; margin-top: 5px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
        .card h2 { font-size: 16px; margin-bottom: 12px; }
        .team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .slot { background-color: #1a2336; border: 1px solid var(--accent-blue); border-radius: 10px; padding: 10px; }
        .slot input { width: 100%; background: #111827; border: 1px solid #374151; color: white; font-weight: 600; font-size: 13px; outline: none; padding: 6px; border-radius: 6px; text-transform: lowercase; }
        .slot select { width: 100%; background: #111827; border: 1px solid #374151; color: var(--text-sub); font-size: 11px; margin-top: 5px; padding: 5px; border-radius: 6px; }
        .type-tags { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
        .tag { font-size: 9px; padding: 3px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; background: #3b82f6; color: white; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; margin-top: 15px; }
        .score-box { text-align: center; padding: 15px; background: #1a2336; border-radius: 12px; margin-bottom: 15px; }
        .score-val { font-size: 32px; font-weight: 900; color: #10b981; }
        .pro-card { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.3); }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">⚡ ChampAnalyze <span class="badge-pro">PRO</span></div>
        <p class="subtitle">Análisis dinámico en tiempo real (PokeAPI Gen 1-9)</p>
    </header>

    <div class="card">
        <h2>👥 Tu Equipo (6/6)</h2>
        <div class="team-grid" id="teamGrid"></div>
        <button class="btn" id="btnAnalyze" onclick="analyzeTeam()">🔬 Ejecutar Análisis Pro</button>
    </div>

    <div id="results" class="hidden">
        <div class="card">
            <h2>📊 Puntuación de Sinergia Pro</h2>
            <div class="score-box">
                <div class="score-val" id="scoreVal">0/100</div>
                <p id="scoreSubText" style="font-size: 12px; color: var(--text-sub); margin-top: 5px;"></p>
            </div>
            <h3 style="font-size: 13px; margin-bottom: 8px;">🛡️ Mayores Debilidades Detectadas</h3>
            <div class="type-tags" id="weaknessTags"></div>
        </div>

        <div class="card pro-card">
            <h2>🤖 Recomendaciones de la IA Pro</h2>
            <p id="aiRecs" style="font-size: 13px; color: #d1d5db; line-height: 1.5;"></p>
        </div>
    </div>

    <datalist id="all-pokemon-list"></datalist>

    <script>
        const defaultTeam = ["charizard", "arcanine", "garchomp", "dragonite", "venusaur", "beedrill"];

        const typeWeaknesses = {
            normal: ["fighting"], fighting: ["flying", "psychic", "fairy"], flying: ["electric", "ice", "rock"],
            poison: ["ground", "psychic"], ground: ["water", "grass", "ice"], rock: ["water", "grass", "fighting", "ground", "steel"],
            bug: ["fire", "flying", "rock"], ghost: ["ghost", "dark"], steel: ["fire", "fighting", "ground"],
            fire: ["water", "ground", "rock"], water: ["electric", "grass"], grass: ["fire", "ice", "poison", "flying", "bug"],
            electric: ["ground"], psychic: ["bug", "ghost", "dark"], ice: ["fire", "fighting", "rock", "steel"],
            dragon: ["ice", "dragon", "fairy"], dark: ["fighting", "bug", "fairy"], fairy: ["poison", "steel"]
        };

        async function loadAllPokemon() {
            try {
                const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');
                const data = await res.json();
                document.getElementById('all-pokemon-list').innerHTML = data.results.map(p => `<option value="${p.name}">`).join('');
            } catch (e) {
                console.log("Error cargando lista de Pokémon:", e);
            }
        }

        const grid = document.getElementById('teamGrid');
        defaultTeam.forEach((pkmn, idx) => {
            grid.innerHTML += `
                <div class="slot">
                    <input type="text" id="pkm-input-${idx}" list="all-pokemon-list" value="${pkmn}" placeholder="Buscar Pokémon...">
                    <select id="item-${idx}">
                        <option value="Sin Objeto">Sin Objeto</option>
                        <option value="Life Orb">Life Orb</option>
                        <option value="Choice Scarf">Choice Scarf</option>
                        <option value="Leftovers">Leftovers</option>
                        <option value="Focus Sash">Focus Sash</option>
                        <option value="Choice Band">Choice Band</option>
                        <option value="Assault Vest">Assault Vest</option>
                    </select>
                </div>
            `;
        });

        async function analyzeTeam() {
            const btn = document.getElementById('btnAnalyze');
            btn.innerText = "⏳ Analizando equipo...";
            btn.disabled = true;

            let teamNames = [];
            let allTypes = [];
            let weaknessesCount = {};
            let equippedItems = 0;

            for(let i = 0; i < 6; i++) {
                let name = document.getElementById(`pkm-input-${i}`).value.trim().toLowerCase();
                let item = document.getElementById(`item-${i}`).value;
                if(item !== "Sin Objeto") equippedItems++;

                if(name) {
                    teamNames.push(name);
                    try {
                        let res = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
                        if(res.ok) {
                            let data = await res.json();
                            let types = data.types.map(t => t.type.name);
                            allTypes.push(...types);

                            types.forEach(t => {
                                let weaks = typeWeaknesses[t] || [];
                                weaks.forEach(w => {
                                    weaknessesCount[w] = (weaknessesCount[w] || 0) + 1;
                                });
                            });
                        }
                    } catch(e) {
                        console.log("Error consultando Pokémon:", name);
                    }
                }
            }

            // Cálculo dinámico de puntuación
            let uniqueTypes = new Set(allTypes).size;
            let score = Math.min(100, Math.max(30, (uniqueTypes * 8) + (equippedItems * 5) + (teamNames.length * 4)));

            // Formatear debilidades
            let sortedWeaknesses = Object.entries(weaknessesCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 4);

            let weaknessHTML = sortedWeaknesses.length > 0 
                ? sortedWeaknesses.map(([type, count]) => `<span class="tag">${type.toUpperCase()} x${count}</span>`).join(' ')
                : '<span class="tag">Sin debilidades severas</span>';

            document.getElementById('results').classList.remove('hidden');
            document.getElementById('scoreVal').innerText = `${score}/100`;
            document.getElementById('scoreSubText').innerText = `Sinergia calculada para ${teamNames.length} Pokémon (${uniqueTypes} tipos únicos).`;
            document.getElementById('weaknessTags').innerHTML = weaknessHTML;

            let topWeak = sortedWeaknesses[0] ? sortedWeaknesses[0][0] : "desconocida";
            document.getElementById('aiRecs').innerHTML = `
                • Tu equipo actual suma un total de <b>${uniqueTypes} tipos únicos</b>.<br><br>
                • La mayor amenaza global detectada es el tipo <b>${topWeak.toUpperCase()}</b>.<br><br>
                • Tienes <b>${equippedItems} de 6 Pokémon</b> con objeto equipado. ${equippedItems < 6 ? 'Equipa más objetos para mejorar la nota.' : '¡Buena distribución de ítems!'}`;

            btn.innerText = "🔬 Ejecutar Análisis Pro";
            btn.disabled = false;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        loadAllPokemon();
    </script>
</body>
</html>
